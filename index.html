<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>BESO BOT موسوعة ذكية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
   body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #fff;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin: 2vh 0 1vh;
      font-size: 2.5em;
      position: relative;
      animation: fadeInDown 1s ease;
    }

    #robot {
      display: flex;
      justify-content: center;
      margin-bottom: 1vh;
    }

    #chat-box {
      max-height: 45vh;
      overflow-y: auto;
      background: #1c1c1c;
      padding: 2vh 2vw;
      margin: 3vh auto;
      width: 90vw;
      max-width: 800px;
      border-radius: 15px;
      box-shadow: 0 0 50px #0af5;
    }

    #user-input, #send-btn {
      padding: 1em;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
    }

    #user-input {
      width: 70%;
      background: #333;
      color: white;
    }

    #send-btn {
      background: #0af;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    #send-btn:hover {
      background: #08c;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 3vh;
      padding: 0 2vw;
    }

    .media-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 2vh 2vw;
      animation: fadeIn 1s ease-in-out;
    }

    img {
      width: 280px;
      max-width: 90vw;
      border-radius: 12px;
      box-shadow: 0 0 10px #000;
      transition: transform 0.4s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bot-message, .user-message {
      margin: 1vh 0;
      padding: 1vh 1vw;
      border-radius: 10px;
      max-width: 80%;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .user-message {
      background: #0af2;
      margin-right: auto;
      text-align: right;
    }

    .bot-message {
      background: #444;
      margin-left: auto;
      text-align: left;
    }

    .robot-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 2vh;
      animation: floatUp 2s ease-out forwards;
    }

    .robot-3d {
      width: 200px;
      max-width: 50vw;
      height: auto;
      filter: drop-shadow(0 0 10px #0af);
      transform: perspective(600px) rotateY(0deg);
      animation: robotFloat 3s infinite ease-in-out;
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(100px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes robotFloat {
      0% { transform: translateY(0) rotateY(0deg); }
      50% { transform: translateY(-15px) rotateY(10deg); }
      100% { transform: translateY(0) rotateY(0deg); }
    }
    
    .tab-container {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    
    .tab {
      padding: 8px 16px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px 5px 0 0;
      margin: 0 5px;
    }
    
    .tab.active {
      background: #0af;
    }
    
    .images-container {
      display: none;
    }
    
    .images-container.active {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .google-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      margin: 10px 0;
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.05);
      transition: transform 0.2s;
      color: #fff;
    }

    .google-card:hover {
      transform: scale(1.02);
    }

    .google-card h3 {
      margin: 0;
      font-size: 1.1em;
      color: #5cd2ff;
    }

    .google-card p {
      margin: 8px 0;
      font-size: 0.95em;
      color: #ccc;
    }

    .visit-link {
      display: inline-block;
      margin-top: 5px;
      color: #00e0ff;
      text-decoration: underline;
      font-size: 0.9em;
    }
    
    .translation-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    
    .translate-btn {
      padding: 5px 10px;
      background: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8em;
      transition: background 0.3s;
    }
    
    .translate-btn:hover {
      background: #555;
    }
    
    .translate-btn.en {
      background: #1a73e8;
    }
    
    .translate-btn.fr {
      background: #4285f4;
    }
    
    .audio-btn {
      padding: 5px 10px;
      background: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.3s;
    }
    
    .audio-btn:hover {
      background: #555;
    }

    
    .back-btn {
      padding: 5px 10px;
      background: #555;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.3s;
    }
    
    .back-btn:hover {
      background: #777;
    }
    
    .user-translation-buttons {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      margin-top: 5px;
    }
    
    .user-translate-btn {
      padding: 3px 8px;
      background: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.7em;
      transition: background 0.3s;
    }
    
    .user-translate-btn.en {
      background: #1a73e8;
    }
    
    .user-translate-btn.fr {
      background: #4285f4;
    }
  </style>
</head>
<body>

  <h1>🤖 BESO BOT  </h1>

  <!-- 3D Robot Animation -->
  <div class="robot-container">
    <img src="AI-Robot-finding-something.gif" alt="روبوت 3D" class="robot-3d" />
  </div>

  <div id="chat-box"></div>

  <div class="input-row">
    <input type="text" id="user-input" placeholder=" اكتب أي موضوع  :    ..." />
    <button id="send-btn">إرسال</button>
  </div>

  <div class="media-section" id="media-section">
    <div class="tab-container" id="tab-container"></div>
    <div class="images-container active" id="unsplash-images"></div>
    <div class="images-container" id="ai-images"></div>
    <div class="images-container" id="google-container"></div>
  </div>


<script>
const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const unsplashImagesContainer = document.getElementById("unsplash-images");
const aiImagesContainer = document.getElementById("ai-images");
const tabContainer = document.getElementById("tab-container");

const UNSPLASH_KEY = "3U87wEsJMDsPM-Z6EKZQXXxnpSXOG-Ym8jVUpE0Hng4";
const HF_API_KEY = "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";
const GOOGLE_API_KEY = "AIzaSyCE_EfeK5iDaCXkZUs45jSNIrETnwXC8hg";
const GOOGLE_CX = "d69031fbb9c784bfd";
const DEEPL_API_KEY = ""; // يمكنك إضافة مفتاح DeepL هنا إذا كنت تريد استخدامه

let currentUtterance = null;

function createTabs() {
  tabContainer.innerHTML = `
    <button class="tab active" onclick="switchTab('unsplash')">صور بحث</button>
    <button class="tab" onclick="switchTab('ai')">صور مولدة</button>
    <button class="tab" onclick="switchTab('google')">نتائج جوجل</button>
  `;
}

window.switchTab = function(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.images-container').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab[onclick*='${tab}']`).classList.add('active');
 const idMap = {
  unsplash: "unsplash-images",
  ai: "ai-images",
  google: "google-container"
};
document.getElementById(idMap[tab])?.classList.add('active');
};

async function fetchImages(query) {
  const randomPage = Math.floor(Math.random() * 10) + 1; // رقم صفحة عشوائي من 1 لـ 10
  const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&page=${randomPage}&per_page=20&client_id=${UNSPLASH_KEY}`);
  const data = await res.json();
  return data.results.map(p => p.urls.small);
}

async function generateAIImages(prompt) {
  try {
    const response = await fetch(
      "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0",
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${HF_API_KEY}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ inputs: prompt, options: { wait_for_model: true } }),
      }
    );
    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
    const blob = await response.blob();
    return URL.createObjectURL(blob);
  } catch (err) {
    console.error("AI image error:", err);
    return null;
  }
}

async function fetchWikipediaSummary(query) {
  const arRes = await fetch(`https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
  const arData = await arRes.json();
  if (arData.query.search.length > 0) {
    const title = arData.query.search[0].title;
    const summaryRes = await fetch(`https://ar.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
    const summaryData = await summaryRes.json();
    if (summaryData.extract) return { text: summaryData.extract, lang: "ar" };
  }

  const enRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
  const enData = await enRes.json();
  if (enData.query.search.length > 0) {
    const title = enData.query.search[0].title;
    const summaryRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
    const summaryData = await summaryRes.json();
    if (summaryData.extract) return { text: summaryData.extract, lang: "en" };
  }
  throw new Error("لا توجد معلومات كافية.");
}

async function fetchGoogleResults(query) {
  const response = await fetch(`https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${GOOGLE_CX}&q=${query}&num=10`);
  const data = await response.json();

  const results = data.items?.map(item => ({
    title: item.title,
    snippet: item.snippet,
    link: item.link,
    displayLink: item.displayLink
  })) || [];

  // إضافة روابط ويكيبيديا يدويًا ضمن النتائج لو غير موجودة
  if (!results.some(r => r.displayLink?.includes("wikipedia.org"))) {
    results.unshift({
      title: "بحث في ويكيبيديا",
      snippet: "انقر هنا للبحث عن هذا الموضوع في ويكيبيديا مباشرة.",
      link: `https://ar.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(query)}`
    });
  }

  return results;
}

async function translateText(text, targetLang) {
  try {
    // استخدام خدمة ترجمة جوجل (هذا حل بسيط وقد لا يعمل دائماً)
    const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
    const data = await response.json();
    return data[0][0][0];
  } catch (error) {
    console.error("Translation error:", error);
    return "فشل في الترجمة. يرجى المحاولة لاحقاً.";
  }
}

function extractKeywords(text) {
  const stopWords = ["عن", "هو", "هي", "من", "في", "و", "إلى", "على", "ما", "لم"];
  return text.replace(/[^؀-ۿ\w\s]/g, '').split(' ').filter(w => w.length > 2 && !stopWords.includes(w));
}

function speak(text, lang, onEnd) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang === "ar" ? "ar-EG" : "en-US";
  const voice = window.speechSynthesis.getVoices().find(v => v.lang.startsWith(utterance.lang));
  if (voice) utterance.voice = voice;
  utterance.onend = () => onEnd?.();
  window.speechSynthesis.speak(utterance);
  return utterance;
}

sendBtn.onclick = async () => {
  const msg = userInput.value.trim();
  if (!msg) return;

  const messageId = `msg-${Date.now()}`;
  chatBox.innerHTML += `
    <div class="user-message" id="${messageId}" data-original-text="${encodeURIComponent(msg)}" data-lang="ar">
      🧑‍💻 ${msg}
      <div class="user-translation-buttons">
        <button class="user-translate-btn en" onclick="translateMessage('${messageId}', 'en')">EN</button>
        <button class="user-translate-btn fr" onclick="translateMessage('${messageId}', 'fr')">FR</button>
      </div>
    </div>`;
    
  userInput.value = "";
  createTabs();

  unsplashImagesContainer.innerHTML = aiImagesContainer.innerHTML = `<div style="text-align:center">⏳ جاري التحميل...</div>`;
  document.getElementById("google-container").innerHTML = `<div style="text-align:center">🔍 جاري جلب نتائج من جوجل...</div>`;

  const keywords = extractKeywords(msg);
  const query = keywords.length > 0 ? keywords.join(" ") : msg;

  try {
    const wiki = await fetchWikipediaSummary(query);
    const audioBtnId = `audio-${Date.now()}`;
    const botMessageId = `msg-${Date.now()}`;
    
    // حفظ النص الأصلي في سمة data
    chatBox.innerHTML += `
      <div class="bot-message" id="${botMessageId}" data-original-text="${encodeURIComponent(wiki.text)}" data-lang="${wiki.lang}">
        ${wiki.lang === "ar" ? "📚 ويكيبيديا العربية:" : "📘 Wikipedia:"}<br>${wiki.text}<br>
        <button id="${audioBtnId}" class="audio-btn">🔊 تشغيل الصوت</button>
        <div class="translation-buttons">
          <button class="translate-btn en" onclick="translateMessage('${botMessageId}', 'en')">English</button>
          <button class="translate-btn fr" onclick="translateMessage('${botMessageId}', 'fr')">Français</button>
        </div>
      </div>`;
      
    document.getElementById(audioBtnId).onclick = () => {
      if (currentUtterance) {
        window.speechSynthesis.cancel();
        currentUtterance = null;
        document.getElementById(audioBtnId).textContent = "🔊 تشغيل الصوت";
      } else {
        currentUtterance = speak(wiki.text, wiki.lang, () => {
          document.getElementById(audioBtnId).textContent = "🔊 تشغيل الصوت";
          currentUtterance = null;
        });
        document.getElementById(audioBtnId).textContent = "⏹️ إيقاف الصوت";
      }
    };

  } catch {
    chatBox.innerHTML += `<div class="bot-message">⚠️ لم أتمكن من العثور على معلومة من ويكيبيديا.</div>`;
  }
try {
    const images = await fetchImages(query);
    unsplashImagesContainer.innerHTML = images.map(src => `<img src="${src}" />`).join('');
  } catch {
    unsplashImagesContainer.innerHTML = `<div style="color:red">⚠️ فشل تحميل صور Unsplash.</div>`;
  }

  try {
    aiImagesContainer.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const img = await generateAIImages(query);
      if (img) aiImagesContainer.innerHTML += `<img src="${img}" />`;
    }
  } catch {
    aiImagesContainer.innerHTML = `<div style="color:red">⚠️ فشل توليد الصور بالذكاء الاصطناعي.</div>`;
  }

  try {
    const results = await fetchGoogleResults(query);
    const container = document.getElementById("google-container");
    if (results.length === 0) {
      container.innerHTML = `<div>🔍 لا توجد نتائج من جوجل.</div>`;
    } else {
      container.innerHTML = results.map(r => `
        <div class="google-card">
          <h3><a href="${r.link}" target="_blank">${r.title}</a></h3>
          <p>${r.snippet}</p>
          <a href="${r.link}" class="visit-link" target="_blank">🔗 زيارة الموقع</a>
        </div>`).join('');
    }
  } catch {
    document.getElementById("google-container").innerHTML = `<div>⚠️ تعذر جلب نتائج جوجل.</div>`;
  }

  chatBox.scrollTop = chatBox.scrollHeight;
};

window.translateMessage = async function(messageId, targetLang) {
  const messageElement = document.getElementById(messageId);
  if (!messageElement) return;
  
  // حفظ HTML الأصلي في سمة data قبل الترجمة
  if (!messageElement.dataset.originalHtml) {
    messageElement.dataset.originalHtml = messageElement.innerHTML;
  }
  
  const originalText = decodeURIComponent(messageElement.dataset.originalText);
  const originalLang = messageElement.dataset.lang;
  
  const langName = {
    en: "الإنجليزية",
    fr: "الفرنسية"
  }[targetLang];
  
  messageElement.innerHTML = `<div style="text-align:center">⏳ جاري الترجمة إلى ${langName}...</div>`;
  
  try {
    const translatedText = await translateText(originalText, targetLang);
    const audioBtnId = `audio-${Date.now()}`;
    
    messageElement.innerHTML = `
      <div style="margin-bottom:10px">🌍 الترجمة إلى ${langName}:</div>
      <div>${translatedText}</div>
      <button id="${audioBtnId}" class="audio-btn">🔊 تشغيل الصوت</button>
      <div class="translation-buttons">
        <button class="back-btn" onclick="restoreOriginalMessage('${messageId}')">↩ العودة للنص الأصلي</button>
      </div>`;
      
    document.getElementById(audioBtnId).onclick = () => {
      if (currentUtterance) {
        window.speechSynthesis.cancel();
        currentUtterance = null;
        document.getElementById(audioBtnId).textContent = "🔊 تشغيل الصوت";
      } else {
        currentUtterance = speak(translatedText, targetLang, () => {
          document.getElementById(audioBtnId).textContent = "🔊 تشغيل الصوت";
          currentUtterance = null;
        });
        document.getElementById(audioBtnId).textContent = "⏹️ إيقاف الصوت";
      }
    };
  } catch (error) {
    messageElement.innerHTML = `
      <div style="color:red">⚠️ فشل في الترجمة إلى ${langName}. يرجى المحاولة لاحقاً.</div>
      <button class="back-btn" onclick="restoreOriginalMessage('${messageId}')">↩ العودة</button>`;
  }
};

window.restoreOriginalMessage = function(messageId) {
  const messageElement = document.getElementById(messageId);
  if (messageElement && messageElement.dataset.originalHtml) {
    messageElement.innerHTML = messageElement.dataset.originalHtml;
    
    // إعادة تعيين حدث التشغيل الصوتي
    const audioBtn = messageElement.querySelector('.audio-btn');
    if (audioBtn) {
      const originalText = decodeURIComponent(messageElement.dataset.originalText);
      const originalLang = messageElement.dataset.lang;
      
      audioBtn.onclick = () => {
        if (currentUtterance) {
          window.speechSynthesis.cancel();
          currentUtterance = null;
          audioBtn.textContent = "🔊 تشغيل الصوت";
        } else {
          currentUtterance = speak(originalText, originalLang, () => {
            audioBtn.textContent = "🔊 تشغيل الصوت";
            currentUtterance = null;
          });
          audioBtn.textContent = "⏹️ إيقاف الصوت";
        }
      };
    }
    
    // إعادة تعيين أحداث الترجمة لأزرار المستخدم
    const userTranslateBtns = messageElement.querySelectorAll('.user-translate-btn');
    if (userTranslateBtns.length > 0) {
      userTranslateBtns.forEach(btn => {
        const lang = btn.textContent.trim().toLowerCase();
        btn.onclick = () => translateMessage(messageId, lang);
      });
    }
  }
};

window.onload = createTabs;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>BESO BOT موسوعة ذكية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #fff;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin: 2vh 0 1vh;
      font-size: 2.5em;
      position: relative;
      animation: fadeInDown 1s ease;
    }

    #robot {
      display: flex;
      justify-content: center;
      margin-bottom: 1vh;
    }

    #chat-box {
      max-height: 45vh;
      overflow-y: auto;
      background: #1c1c1c;
      padding: 2vh 2vw;
      margin: 3vh auto;
      width: 90vw;
      max-width: 800px;
      border-radius: 15px;
      box-shadow: 0 0 50px #0af5;
    }

    #user-input, #send-btn {
      padding: 1em;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
    }

    #user-input {
      width: 70%;
      background: #333;
      color: white;
    }

    #send-btn {
      background: #0af;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    #send-btn:hover {
      background: #08c;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 3vh;
      padding: 0 2vw;
    }

    .media-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 2vh 2vw;
      animation: fadeIn 1s ease-in-out;
    }

    img {
      width: 280px;
      max-width: 90vw;
      border-radius: 12px;
      box-shadow: 0 0 10px #000;
      transition: transform 0.4s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bot-message, .user-message {
      margin: 1vh 0;
      padding: 1vh 1vw;
      border-radius: 10px;
      max-width: 80%;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .user-message {
      background: #0af2;
      margin-right: auto;
      text-align: right;
    }

    .bot-message {
      background: #444;
      margin-left: auto;
      text-align: left;
    }

    .robot-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 2vh;
      animation: floatUp 2s ease-out forwards;
    }

    .robot-3d {
      width: 200px;
      max-width: 50vw;
      height: auto;
      filter: drop-shadow(0 0 10px #0af);
      transform: perspective(600px) rotateY(0deg);
      animation: robotFloat 3s infinite ease-in-out;
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(100px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes robotFloat {
      0% { transform: translateY(0) rotateY(0deg); }
      50% { transform: translateY(-15px) rotateY(10deg); }
      100% { transform: translateY(0) rotateY(0deg); }
    }
    
    .tab-container {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    
    .tab {
      padding: 8px 16px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px 5px 0 0;
      margin: 0 5px;
    }
    
    .tab.active {
      background: #0af;
    }
    
    .images-container {
      display: none;
    }
    
    .images-container.active {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
  </style>
</head>
<body>

  <h1>🤖 BESO BOT  </h1>

  <!-- 3D Robot Animation -->
  <div class="robot-container">
    <img src="AI-Robot-finding-something.gif" alt="روبوت 3D" class="robot-3d" />
  </div>

  <div id="chat-box"></div>

  <div class="input-row">
    <input type="text" id="user-input" placeholder=" اكتب أي موضوع  :    ..." />
    <button id="send-btn">إرسال</button>
  
  </div>

  <div class="media-section" id="media-section">
    <div class="tab-container" id="tab-container"></div>
    <div class="images-container active" id="unsplash-images"></div>
    <div class="images-container" id="ai-images"></div>
  </div>

<script>
  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const unsplashImagesContainer = document.getElementById("unsplash-images");
  const aiImagesContainer = document.getElementById("ai-images");
  const tabContainer = document.getElementById("tab-container");
  const UNSPLASH_KEY = "3U87wEsJMDsPM-Z6EKZQXXxnpSXOG-Ym8jVUpE0Hng4";
  const HF_API_KEY = "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"; // استبدل بمفتاح API الخاص بك
  let currentUtterance = null;

  // إنشاء ألسنة التبويب
  function createTabs() {
    tabContainer.innerHTML = `
      <button class="tab active" onclick="switchTab('unsplash')">صور بحث</button>
      <button class="tab" onclick="switchTab('ai')"> صور مولدة بالذكاء الاصطناعي</button>
    `;
  }

  // تبديل بين التبويبات
  window.switchTab = function(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.images-container').forEach(c => c.classList.remove('active'));
    
    if (tab === 'unsplash') {
      document.querySelector('.tab:nth-child(1)').classList.add('active');
      unsplashImagesContainer.classList.add('active');
    } else {
      document.querySelector('.tab:nth-child(2)').classList.add('active');
      aiImagesContainer.classList.add('active');
    }
  }

  async function fetchImages(query) {
    const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=9&client_id=${UNSPLASH_KEY}`);
    const data = await res.json();
    return data.results.map(p => p.urls.small);
  }

  async function generateAIImages(prompt) {
    try {
      const response = await fetch(
        "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0",
        {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${HF_API_KEY}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            inputs: prompt,
            options: { wait_for_model: true }
          }),
        }
      );
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const imageBlob = await response.blob();
      return URL.createObjectURL(imageBlob);
    } catch (error) {
      console.error("Error generating AI image:", error);
      return null;
    }
  }

  async function fetchWikipediaSummary(query) {
    // البحث في ويكيبيديا العربية أولاً
    let searchRes = await fetch(`https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
    let searchData = await searchRes.json();

    if (searchData.query.search.length > 0) {
      let topTitle = searchData.query.search[0].title;
      let summaryRes = await fetch(`https://ar.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topTitle)}`);
      if (summaryRes.ok) {
        const summaryData = await summaryRes.json();
        if (summaryData.extract) return { text: summaryData.extract, lang: "ar" };
      }
    }

    // لو العربية فشلت، نبحث في ويكيبيديا الإنجليزية
    let enSearchRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
    let enSearchData = await enSearchRes.json();

    if (enSearchData.query.search.length > 0) {
      let topEnTitle = enSearchData.query.search[0].title;
      let enSummaryRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topEnTitle)}`);
      if (enSummaryRes.ok) {
        const enSummaryData = await enSummaryRes.json();
        if (enSummaryData.extract) return { text: enSummaryData.extract, lang: "en" };
      }
    }

    throw new Error("لم يتم العثور على معلومات كافية.");
  }

  function extractKeywords(sentence) {
    const stopWords = ["عن", "هو", "هي", "كان", "التي", "الذي", "ذلك", "من", "في", "على", "مع", "الى", "و", "أن", "ما", "لم", "لن", "هذه"];
    return sentence
      .replace(/[^\w\s\u0600-\u06FF]/gi, '')
      .split(' ')
      .filter(word => word.length > 2 && !stopWords.includes(word.toLowerCase()));
  }

  function speak(text, lang, onEndCallback) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === "ar" ? "ar-EG" : "en-US";
    const voices = window.speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang === utterance.lang || v.lang.includes(lang));
    if (voice) {
      utterance.voice = voice;
    }
    utterance.onend = () => {
      if (onEndCallback) onEndCallback();
    };
    window.speechSynthesis.speak(utterance);
    return utterance;
  }

  sendBtn.onclick = async () => {
    const msg = userInput.value.trim();
    if (msg === "") return;

    // عرض رسالة المستخدم
    chatBox.innerHTML += `<div class="user-message">🧑‍💻 ${msg}</div>`;
    userInput.value = "";
    unsplashImagesContainer.innerHTML = `<div style="color:gray;width:100%;text-align:center">جاري تحميل الصور من Unsplash...</div>`;
    aiImagesContainer.innerHTML = `<div style="color:gray;width:100%;text-align:center">جاري توليد الصور بالذكاء الاصطناعي...</div>`;
    createTabs();

    // استخراج الكلمات المفتاحية
    const keywords = extractKeywords(msg);
    const query = keywords.length > 0 ? keywords.join(' ') : msg;

    // ويكيبيديا
    try {
      const wiki = await fetchWikipediaSummary(msg);
      const plainText = wiki.text;
      const lang = wiki.lang;
      const isAr = lang === "ar";
      const audioBtnId = `audio-btn-${Date.now()}`;

      chatBox.innerHTML += `
        <div class="bot-message">
          ${isAr ? "📚 من ويكيبيديا العربية:" : "📘 من Wikipedia الإنجليزية:"}<br>${plainText}
          <br>
          <button id="${audioBtnId}" style="margin-top: 10px; padding: 8px 15px; background: #0af; color: white; border: none; border-radius: 8px; cursor: pointer;">
            🔊 تشغيل الصوت
          </button>
        </div>
      `;

      const audioBtn = document.getElementById(audioBtnId);
      let isSpeaking = false;

      audioBtn.onclick = () => {
        if (!isSpeaking) {
          currentUtterance = speak(plainText, lang, () => {
            isSpeaking = false;
            audioBtn.textContent = "🔊 تشغيل الصوت";
          });
          isSpeaking = true;
          audioBtn.textContent = "⏹️ إيقاف الصوت";
        } else {
          window.speechSynthesis.cancel();
          isSpeaking = false;
          audioBtn.textContent = "🔊 تشغيل الصوت";
        }
      };
    } catch (err) {
      chatBox.innerHTML += `<div class="bot-message">❌ لم أتمكن من العثور على معلومة من ويكيبيديا.</div>`;
    }

    // الصور من Unsplash
    try {
      const images = await fetchImages(query);
      unsplashImagesContainer.innerHTML = "";
      if (images.length === 0) {
        unsplashImagesContainer.innerHTML = `<div style="color:red;width:100%;text-align:center">لم يتم العثور على صور  لهذا الموضوع.</div>`;
      } else {
        images.forEach(src => {
          unsplashImagesContainer.innerHTML += `<img src="${src}" alt="صورة عن ${msg}" />`;
        });
      }
    } catch {
      unsplashImagesContainer.innerHTML = `<div style="color:red;width:100%;text-align:center">حدث خطأ أثناء تحميل الصور  .</div>`;
    }

    // توليد صور بالذكاء الاصطناعي من Hugging Face
    try {
      aiImagesContainer.innerHTML = "";
      // نولد 4 صور مختلفة
      for (let i = 0; i < 4; i++) {
        const imgUrl = await generateAIImages(msg);
        if (imgUrl) {
          aiImagesContainer.innerHTML += `<img src="${imgUrl}" alt="صورة مولدة بالذكاء الاصطناعي عن ${msg}" />`;
        }
      }
      
      if (aiImagesContainer.innerHTML === "") {
        aiImagesContainer.innerHTML = `<div style="color:red;width:100%;text-align:center">حدث خطأ أثناء توليد الصور بالذكاء الاصطناعي.</div>`;
      }
    } catch (error) {
      console.error("Error generating AI images:", error);
      aiImagesContainer.innerHTML = `<div style="color:red;width:100%;text-align:center">حدث خطأ أثناء توليد الصور بالذكاء الاصطناعي.</div>`;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  };

  // تهيئة الألسنة عند تحميل الصفحة
  window.onload = createTabs;
</script>

</body>
</html>
